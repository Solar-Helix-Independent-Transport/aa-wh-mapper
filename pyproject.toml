[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-wh-mapper"
description = "Wormhole Mapping and Navigation Plugin for Alliance Auth"
readme = "README.md"
keywords = [
    "allianceauth",
    "wh-mapper",
]
license = { file = "LICENSE" }
authors = [
    { name = "Aaron Kable", email = "aaronkable@gmail.com" },
]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]
dependencies = [
    "allianceauth>=5",
    "channels",
    "channels-redis",
    "django-eveonline-sde>=0.0.1b11",
    "django-ninja",
    "redis",
    # "daphne",
]
urls.Changelog = "https://github.com/Solar-Helix-Independent-Transport/aa-wh-mapper/blob/master/CHANGELOG.md"
urls.Tracker = "https://github.com/Solar-Helix-Independent-Transport/aa-wh-mapper/issues"

[tool.hatch]
version.path = "wh_mapper/__init__.py"
build.include = [
    "/wh_mapper",
]
